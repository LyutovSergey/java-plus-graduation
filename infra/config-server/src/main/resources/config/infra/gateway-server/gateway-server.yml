server:
  port: 8080

spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - name: Retry
          args:
            retries: 2
            statuses:
              - BAD_GATEWAY
              - SERVICE_UNAVAILABLE
              - GATEWAY_TIMEOUT
            methods:
              - GET
            backoff:
              firstBackoff: 100ms
              maxBackoff: 500ms
      routes:
        - id: rating-service
          uri: lb://rating-service
          predicates:
            - Path=/users/{userId}/events/{eventId}/likes

        - id: request-service
          uri: lb://request-service
          predicates:
            - Path=/users/{userId}/requests,/users/{userId}/requests/{requestId}/cancel,/users/{userId}/events/{eventId}/requests

        - id: event-service-private
          uri: lb://event-service
          predicates:
            - Path=/users/{userId}/events/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/admin/users,/admin/users/**

        - id: event-service-admin
          uri: lb://event-service
          predicates:
            - Path=/admin/**

        - id: event-service-public
          uri: lb://event-service
          predicates:
            - Path=/events/**,/categories,/categories/**,/compilations/**

        - id: stats-service-hit
          uri: lb://stats-server
          predicates:
            - Path=/hit
            - Method=POST

        - id: stats-service-get
          uri: lb://stats-server
          predicates:
            - Path=/stats
            - Method=GET

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:8443"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            exposed-headers:
              - Location
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.value}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.cloud.config: DEBUG
    com.netflix.discovery: DEBUG