spring:
  application:
    name: event-service
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  config:
    import: "configserver:"
  cloud:
    config:
      discovery:
        enabled: true
        service-id: config-server
      fail-fast: true
      retry:
        initial-interval: 3000
        max-interval: 10000
        max-attempts: 6
        multiplier: 1.5

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true